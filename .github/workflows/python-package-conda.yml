name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your code
    - uses: actions/checkout@v4

    # 2. Setup Miniconda and automatically build your environment
    - name: Setup Conda Environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: my-env            # Name of the environment
        environment-file: environment.yml       # Path to your environment file
        auto-activate-base: false

    # 3. Lint with flake8 (Note: Make sure flake8 and pytest are inside your environment.yml, 
    #    or add a step to install them. It's faster to include them in environment.yml!)
    - name: Lint with flake8
      shell: bash -el {0} # This special shell wrapper ensures conda is fully activated
      run: |
        conda install -y flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 4. Run tests
    - name: Test with pytest
      shell: bash -el {0}
      run: |
        conda install -y pytest
        pytest
